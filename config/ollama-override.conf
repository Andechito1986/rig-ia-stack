# Drop-in de systemd para ollama.service
# Se instala en: /etc/systemd/system/ollama.service.d/override.conf
# por el script scripts/02-instalar-ollama.sh
#
# Tras modificarlo manualmente:
#   sudo systemctl daemon-reload && sudo systemctl restart ollama.service

[Service]
# Pesos de los modelos en la partición dedicada (~780 GB) montada en /models.
# El directorio /models/ollama debe existir y pertenecer al usuario 'ollama'.
Environment="OLLAMA_MODELS=/models/ollama"

# Escuchar en todas las interfaces para que lo alcancen:
#   - Open WebUI dentro de Docker (vía host.docker.internal)
#   - otros equipos de la red local (p. ej. el Windows de escritorio)
# La API queda en http://0.0.0.0:11434 (acceso LAN: http://172.16.16.70:11434)
Environment="OLLAMA_HOST=0.0.0.0:11434"
